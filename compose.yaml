name: showwatch

# DATABASE_URL in .env points at localhost:5433 (for tools on this PC). Inside Compose the
# services reach Postgres by service name, so each one overrides it below.
x-database-url: &database-url
  DATABASE_URL: postgresql+asyncpg://showwatch:${POSTGRES_PASSWORD}@postgres:5432/showwatch

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: showwatch
      POSTGRES_DB: showwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432" # host port 5433: the native PostgreSQL on this PC owns 5432
    volumes:
      - showwatch_pgdata:/var/lib/postgresql # the path Postgres 18 images expect
    healthcheck:
      # -h forces a TCP check: over the unix socket it can pass during the entrypoint's
      # temporary init server, before Postgres accepts the connections `migrate` makes.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U showwatch -d showwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: showwatch-bot
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: bot
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    image: showwatch-bot
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: bot
    env_file:
      - path: .env
      - path: .env.llm
        required: false
    environment:
      <<: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: showwatch-worker
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    env_file:
      - path: .env
      - path: .env.llm
        required: false
    environment:
      <<: *database-url
    init: true
    shm_size: "1gb"
    volumes:
      - showwatch_profiles:/profiles
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  showwatch_pgdata:
  showwatch_profiles:
