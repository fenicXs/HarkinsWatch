[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "showwatch"
version = "0.1.0"
description = "Watches movie theatre chains for ticket openings and books seats."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pydantic-settings==2.16.3",
    "python-telegram-bot==22.8",
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "playwright==1.65.2",
    "httpx==0.28.1",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/showwatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "browser: needs an installed Playwright Chromium",
    "integration: needs a Postgres database through TEST_DATABASE_URL",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["legacy", "**/*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
exclude = ["legacy/"]

[tool.coverage.run]
source = ["src/showwatch"]
branch = true
concurrency = ["greenlet", "thread"]
omit = ["legacy/*"]

[tool.coverage.report]
# The 85% gate covers the logic modules; each milestone adds its own (docs/plan.md, CI).
include = [
    "src/showwatch/domain/*",
    "src/showwatch/db/*",
    "src/showwatch/bot/handlers/*",
    "src/showwatch/bot/app.py",
    "src/showwatch/bot/keyboards.py",
    "src/showwatch/notify.py",
]
fail_under = 85
show_missing = true
